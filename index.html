<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Weekly meal planner: drag recipes into your calendar and get a shopping list."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Meal Planner</title>
    <script>
      try {
        var u = localStorage.getItem("meal-planner:session");
        var t = JSON.parse(localStorage.getItem("meal-planner:" + u + ":settings")).theme;
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
